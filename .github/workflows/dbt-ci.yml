name: dbt

# Three jobs now:
#   compile     — every PR. Parses/compiles only, no warehouse writes.
#   build       — merge to main. Builds + tests against dev.
#   build-prod  — after build succeeds, gated by the "prod" GitHub
#                 environment (branch restriction + required reviewer,
#                 same gate deploy.yml and airflow-deploy.yml already use).
#
# Why prod is a SEPARATE job, not the same job re-targeted: dev proving
# itself first is the whole point of this pattern (see every other
# deploy workflow in this repo). A dbt bug that passes dev's tests but
# is somehow prod-specific is exactly what this ordering catches BEFORE
# prod ever sees the change — build-prod only ever runs after build has
# already succeeded.

on:
  pull_request:
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-ci.yml'
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-ci.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "009073574996"
  PYTHON_VERSION: "3.12"

jobs:
  compile:
    name: Compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Assume dev deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/retail-dev-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Snowflake key
        run: |
          aws ssm get-parameter --name "/retail/dev/snowflake/private_key" \
            --with-decryption --query "Parameter.Value" --output text > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          echo "SNOWFLAKE_DEV_KEY_PATH=/tmp/sf_key.p8" >> $GITHUB_ENV

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILE'
          retail_platform:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: BRTNPNX-IH35235
                user: RETAIL_DEV_USER
                private_key_path: "{{ env_var('SNOWFLAKE_DEV_KEY_PATH') }}"
                role: RETAIL_TRANSFORMER_DEV
                warehouse: RETAIL_WH
                database: RETAIL_DEV
                schema: PUBLIC
                threads: 4
          PROFILE

      - run: dbt deps
      - run: dbt parse
      - run: dbt compile

      - name: Check documentation coverage
        run: |
          python - <<'PY'
          import json, sys, pathlib
          manifest = json.loads(pathlib.Path("target/manifest.json").read_text())
          undocumented = [
              node["name"] for node in manifest["nodes"].values()
              if node["resource_type"] == "model" and not node.get("description", "").strip()
          ]
          if undocumented:
              print("Models with no description:")
              for name in undocumented: print(f"  - {name}")
              sys.exit(1)
          print("All models documented.")
          PY

      - name: Remove Snowflake key
        if: always()
        run: rm -f /tmp/sf_key.p8

  build:
    name: Build and test (dev)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: dbt

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Assume dev deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/retail-dev-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Snowflake key
        run: |
          aws ssm get-parameter --name "/retail/dev/snowflake/private_key" \
            --with-decryption --query "Parameter.Value" --output text > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          echo "SNOWFLAKE_DEV_KEY_PATH=/tmp/sf_key.p8" >> $GITHUB_ENV

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILE'
          retail_platform:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: BRTNPNX-IH35235
                user: RETAIL_DEV_USER
                private_key_path: "{{ env_var('SNOWFLAKE_DEV_KEY_PATH') }}"
                role: RETAIL_TRANSFORMER_DEV
                warehouse: RETAIL_WH
                database: RETAIL_DEV
                schema: PUBLIC
                threads: 4
          PROFILE

      - run: dbt deps
      - run: dbt seed
      - name: dbt build
        run: dbt build

      - name: Reconciliation report
        if: always()
        run: |
          dbt show --inline "
            select period, ndjson_source_lines, glue_wrote_to_s3, snowflake_loaded,
                   dbt_staging_rows, s3_to_snowflake_diff, snowflake_to_staging_diff, recon_status
            from {{ ref('fct_pipeline_reconciliation') }}
            order by period
          " --limit 50 | tee recon.txt
          { echo "### Pipeline reconciliation (dev)"; echo; echo '```'; cat recon.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Remove Snowflake key
        if: always()
        run: rm -f /tmp/sf_key.p8

  build-prod:
    name: Build and test (prod)
    needs: build
    runs-on: ubuntu-latest
    environment: prod   # branch restriction + required reviewer, same as deploy-prod elsewhere
    defaults:
      run:
        working-directory: dbt

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Assume prod deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/retail-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Snowflake key
        run: |
          aws ssm get-parameter --name "/retail/prod/snowflake/private_key" \
            --with-decryption --query "Parameter.Value" --output text > /tmp/sf_key.p8
          chmod 600 /tmp/sf_key.p8
          echo "SNOWFLAKE_PROD_KEY_PATH=/tmp/sf_key.p8" >> $GITHUB_ENV

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILE'
          retail_platform:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: BRTNPNX-IH35235
                user: RETAIL_PROD_USER
                private_key_path: "{{ env_var('SNOWFLAKE_PROD_KEY_PATH') }}"
                role: RETAIL_TRANSFORMER_PROD
                warehouse: RETAIL_WH
                database: RETAIL_PROD
                schema: PUBLIC
                threads: 4
          PROFILE

      - run: dbt deps
      - run: dbt seed --target prod

      # Same reasoning as dev: build interleaves models and tests in
      # dependency order, so a failing test on prod stops downstream
      # models rather than letting marts build on unreconciled data.
      - name: dbt build (prod)
        run: dbt build --target prod

      - name: Reconciliation report (prod)
        if: always()
        run: |
          dbt show --target prod --inline "
            select period, ndjson_source_lines, glue_wrote_to_s3, snowflake_loaded,
                   dbt_staging_rows, s3_to_snowflake_diff, snowflake_to_staging_diff, recon_status
            from {{ ref('fct_pipeline_reconciliation') }}
            order by period
          " --limit 50 | tee recon_prod.txt
          { echo "### Pipeline reconciliation (prod)"; echo; echo '```'; cat recon_prod.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Remove Snowflake key
        if: always()
        run: rm -f /tmp/sf_key.p8