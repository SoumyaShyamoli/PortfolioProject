name: PR checks

# Runs on every pull request. Lints the Python, validates the Terraform, and
# produces a plan against dev — posted as a PR comment so the diff is
# reviewable before merge.
#
# Read-only. Nothing here changes infrastructure.

on:
  pull_request:
    branches: [main]

# Required for OIDC. Without id-token: write the AWS credential step cannot
# request a token, and the failure surfaces as "Not authorized to perform
# sts:AssumeRoleWithWebIdentity" rather than anything about a missing token.
permissions:
  id-token: write        # assume the AWS role via OIDC
  contents: read         # check out the repo
  pull-requests: write   # post the plan as a comment

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.15.8"
  AWS_ACCOUNT_ID: "009073574996"


jobs:
  python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ruff

      # Catches syntax errors before a broken script reaches S3. A Glue job
      # whose script does not parse still bills the one-minute minimum.
      - name: Compile check
        run: python -m compileall -q ingestion glue

      # Note: ruff.toml sets target-version = "py310" to match the Glue
      # runtime, so it will not suggest 3.11+ syntax that would fail there.
      - name: Ruff
        run: ruff check ingestion glue

  terraform:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      # TEMPORARY — remove once OIDC is confirmed working.
      # Decodes the ID token payload to show the exact sub/aud claims AWS
      # evaluates against the role's trust policy. No signature is verified
      # and nothing secret is printed; these are the same claims AWS sees.
      #- name: Debug OIDC claims
      #  uses: actions/github-script@v7
      #  with:
      #    script: |
      #      const token = await core.getIDToken('sts.amazonaws.com');
      #      const payload = JSON.parse(
      #        Buffer.from(token.split('.')[1], 'base64').toString()
      #      );
      #      core.info('sub:        ' + payload.sub);
      #      core.info('aud:        ' + payload.aud);
      #      core.info('repository: ' + payload.repository);
      #      core.info('ref:        ' + payload.ref);
      #      core.info('event_name: ' + payload.event_name);

      - name: Assume dev deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/retail-dev-cicd-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          # No access keys anywhere. The dev role's trust allows any ref in
          # this repo; the prod role is restricted to refs/heads/main.

      - name: Confirm identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Fails on unformatted code rather than reformatting it, so the diff
      # stays clean and formatting does not become a review topic.
      - name: Format check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # Static security analysis. Soft-fail: it flags things that are
      # genuinely deliberate here (no KMS on buckets holding public research
      # data, no bucket-level logging), and a hard fail would mean either
      # suppressing real findings or building controls the project has
      # documented as out of scope.
      #
      # The findings appear in the PR so they are a decision each time, not
      # a silent pass.
      - name: tfsec
        uses: aquasecurity/tfsec-pr-commenter-action@v1.3.1
        with:
          github_token: ${{ github.token }}
          working_directory: infra/terraform
          soft_fail: true

      - name: Plan
        id: plan
        # set -o pipefail so the step's exit code comes from terraform rather
        # than from tee, which would otherwise always report success.
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      # A destroy or replace in a PR plan is almost always a mistake — a
      # renamed resource, or a changed immutable field. Block the merge rather
      # than let it surprise someone at apply time.
      - name: Block destructive changes
        if: steps.plan.outcome == 'success'
        run: |
          if grep -qE "will be destroyed|must be replaced" plan.txt; then
            echo "::error::Plan contains destroy or replace operations."
            grep -E "will be destroyed|must be replaced" plan.txt
            exit 1
          fi

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const planPath = 'infra/terraform/plan.txt';

            // The plan file will not exist if an earlier step failed. Say so
            // rather than crashing the comment step on ENOENT.
            let plan = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8')
              : 'Plan did not run — an earlier step failed. See the workflow log.';

            // GitHub comments cap at 65536 characters.
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n...truncated. See the workflow log.';
            }

            const body = [
              '### Terraform plan (dev)',
              '',
              `Format check: \`${{ steps.fmt.outcome }}\``,
              `Plan: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1