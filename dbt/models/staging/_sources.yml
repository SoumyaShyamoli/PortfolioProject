version: 2

sources:
  - name: raw
    database: "{{ target.database }}"
    schema: RAW
    description: >
      Landed from S3 by COPY INTO. Typed but not cleaned — cancellations,
      null customer ids and negative quantities all present by design
      (ADR 0005). Raw is the replay point; nothing here is corrected in
      place.

    tables:
      - name: orders
        description: Order lines from staged Parquet, one row per invoice line.
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}

        columns:
          - name: invoice_no
            tests: [not_null]

          - name: stock_code
            tests: [not_null]

          - name: quantity
            tests: [not_null]

          - name: invoice_date
            tests: [not_null]

          - name: unit_price
            tests: [not_null]

          - name: customer_id

          - name: country
            tests: [not_null]

          - name: source_system
            tests:
              - not_null
              - accepted_values:
                  values: ['batch_historical', 'stream_live']

          - name: partition_year
            tests: [not_null]

          - name: partition_month
            tests: [not_null]

          - name: source_file
            tests: [not_null]

      # ✅ Added here under raw.tables
      - name: worldbank_countries
        description: >
          Country metadata from the World Bank API. Includes aggregates
          ('World', 'Euro area') which are filtered in
          stg_worldbank_countries rather than at ingest, per ADR 0005.
        columns:
          - name: country_id
            tests: [unique, not_null]
          - name: country_name
            tests: [not_null]
          - name: region_id

      - name: worldbank_indicators
        description: >
          GDP (NY.GDP.MKTP.CD) and population (SP.POP.TOTL), one row per
          country-indicator-year. Pinned to 2010.
        columns:
          - name: country_id
          - name: indicator_id
            tests:
              - not_null
              - accepted_values:
                  values: ['NY.GDP.MKTP.CD', 'SP.POP.TOTL']
          - name: value

  - name: ops
    database: "{{ target.database }}"
    schema: OPS
    description: Pipeline operational metadata.

    tables:
      - name: glue_recon_raw
        description: >
          One VARIANT row per Glue job run.
        columns:
          - name: recon_record
            tests: [not_null]
